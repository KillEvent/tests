<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Beauté Mélisse – L'évasion par excellence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-main: #f4e3ce;
      --bg-body: #f8efe4;
      --text-main: #3f2717;
      --text-soft: #7b5a41;
      --accent: #da4f40;
      --accent-soft: #d4af37;
      --line: #c8a788;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #fdf7ee 0%, var(--bg-body) 40%, #f2e2d2 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 1180px;
      margin-top: 24px;
    }

    .page-wrapper {
      max-width: 1180px;
      width: 100%;
      background: var(--bg-main);
      border-radius: 26px;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.6);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    }

    /* BARRE SUPÉRIEURE */
    .top-bar {
      grid-column: 1 / -1;
      padding: 18px 56px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      background: linear-gradient(to right, #f7e7d3, #f3ddc5, #f8efe4);
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 32px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .nav-link {
      cursor: pointer;
      position: relative;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      height: 1px;
      width: 0;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    /* LOGO */
    .brand {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand img {
      max-height: 64px;
      width: auto;
      display: block;
    }

    .brand::before,
    .brand::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 120px;
      height: 1px;
      background: var(--line);
      opacity: 0.7;
    }

    .brand::before {
      right: 100%;
      margin-right: 26px;
    }

    .brand::after {
      left: 100%;
      margin-left: 26px;
    }

    /* RESPONSIVE */
    @media (max-width: 960px) {
      body {
        padding: 12px;
      }

      .page-wrapper {
        grid-template-columns: 1fr;
      }

      .nav-left,
      .nav-right {
        display: none;
      }

      .top-bar {
        padding: 14px 20px;
        justify-content: center;
      }

      .brand::before,
      .brand::after {
        display: none;
      }

      .brand img {
        max-height: 52px;
      }
    }
  </style>
</head>

<body>

<div class="page-wrapper">
  <header class="top-bar">
    <nav class="nav-left">
      <span class="nav-link">Réserver</span>
      <span class="nav-link">Prestations</span>
      <span class="nav-link">Galerie</span>
    </nav>

    <!-- LOGO -->
    <div class="brand">
      <img
        src="https://cdn.shopify.com/s/files/1/0726/0690/8753/files/Design_sans_titre_-_2026-01-16T163325.793.png?v=1768577623"
        alt="Beauté Mélisse – Soins naturels hypoallergéniques à domicile"
      />
    </div>

    <nav class="nav-right">
      <span class="nav-link">Avis clients</span>
      <span class="nav-link">Contact</span>
    </nav>
  </header>
</div>

</body>
</html>
